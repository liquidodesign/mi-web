var E = ["Encargar una campaña de gafas inteligentes a un director de cine sitúa la pieza en el terreno del relato: tono onírico, un protagonista de primera línea y la tecnología como excusa narrativa.", "La colaboración pone a dialogar motor y moda en un entorno japonés, con un concepto firmado por el estudio CONSUL.", "La referencia a la canción de Kyu Sakamoto aporta memoria colectiva japonesa, y el rodaje en Kodak da textura analógica a las calles de Ginza.", "Un taxi es un escenario cerrado y cotidiano: permite contar a la marca desde un espacio mínimo, con Taiji como eje del relato.", "Moda y automoción se cruzan con un reparto joven; la dirección creativa de Yoon Ambush marca la identidad visual del proyecto.", "La atención se concentra en la materia: mármol, plexiglás y cuero cosido, un gesto artesanal que se convierte en mobiliario de tienda.", "Sin texto ni créditos en el post, solo las etiquetas insinúan una atmósfera oscura.", "El título, «Sharing secrets», y la etiqueta de San Valentín sugieren un tono íntimo; el post no ofrece más datos.", "El post solo aporta la etiqueta de San Valentín y los nombres de los autores citados.", "«The Garden» sitúa la fragancia en un jardín; la dirección creativa de Troye Sivan y el rodaje en película aportan un aire cinematográfico.", "El peso de la pieza recae en la postproducción: montaje de David Tse y color de Dante Pasquinelli.", "Es un registro audiovisual de pasarela, producido por Atlantis Film.", "El post subraya el concepto Raw Glamour y una combinación técnica concreta: cámara Sony Venice 2 con ópticas de formato medio Mamiya 645.", "Dieciocho viñetas domésticas con rostros de la música, el deporte y la moda convierten la campaña en un mosaico coral más que en un único relato.", "El post no aporta más datos que el título y el director.", "El título pone el ajedrez como eje de la pieza, dirigida por el colectivo rubberband.", "Según las etiquetas, la noche de Madrid es el escenario; el post no incluye créditos.", "La pieza vincula atelier, proceso y tenis; el post no incluye créditos.", "«A practice in letting go» plantea el viaje como un ejercicio personal, rodado en Tokio sobre película.", "Registro de pasarela de Eric Christison, quien también firma el de Hermès en este archivo.", "El post no incluye texto; las etiquetas citan a PJ Lam y a Malgorzata Rabczuk.", "El post no tiene título, texto ni créditos.", "Registro de pasarela de Eric Christison, la misma firma que el de Dries Van Noten SS27.", "La armonía es el concepto: naturaleza y ciudad conviven en capas delicadas de momentos fugaces.", "El post no incluye créditos; las etiquetas citan a The Row y a Daniel Vignal.", "Un corto de marca con título de relato personal, rodado en Sony Venice II con ópticas Panavision PVintage.", "El film acompaña la colección crucero de Matthieu Blazy con la costa como escenario.", "La película mezcla surrealismo y ecos de Hollywood en clave de fiesta nocturna.", "Desfile de Louise Trotter para Bottega Veneta, con ligereza y optimismo estival.", "Un vídeo-ensayo que analiza hacia dónde puede ir Bottega Veneta bajo Louise Trotter.", "Un desfile de archivo que funciona como documento histórico de la marca de Ye.", "El post no ofrece créditos; las etiquetas citan a David Tse y Nicolò Terraneo.", "Dirige John Murd; una etiqueta cita a Arturo Brunetti, sin confirmar su rol.", "La pieza se vincula con Art Basel; la etiqueta apunta a Daniel Hager.", "Un corto sobre fe y memoria, con imágenes íntimas de devoción.", "Película experimental que combina carrera, música y luz, con un equipo amplio de dirección, fotografía, luz y música.", "Un vídeo-ensayo sobre la nueva identidad de Gucci.", "Una colaboración doméstica de Zara Home con Mary Lennox.", "Un documental sobre una colaboración entre la moda de autor y el juguete de colección.", "El post no ofrece créditos; las etiquetas citan a PJ Lam y a Malgorzata Rabczuk.", "El documental se detiene en el diseño del montaje del desfile del ganador }
function tvPing() {
  var t = tvEl("tv"); t.classList.add("show"); clearTimeout(tv.ht);
  if (!tv.direct) return;
  tv.ht = setTimeout(function () { if (!tv.seeking) t.classList.remove("show"); }, 3200);
}
window.addEventListener("message", function (e) {
  if (!tv.on || !tv.frame || e.source !== tv.frame.contentWindow) return;
  var d = e.data; if (typeof d === "string") { try { d = JSON.parse(d); } catch (x) { return; } }
  if (!d || !tv.v) return;
  tv.got = true;
  if (tv.v[0] === "y") {
    if (d.event === "onReady") tvListen();
    if (d.event === "infoDelivery" && d.info) {
      var i = d.info;
      if (i.duration) tv.dur = i.duration;
      if (i.currentTime != null) tv.cur = i.currentTime;
      if (i.playerState != null) { tv.playing = i.playerState === 1 || i.playerState === 3; if (i.playerState === 0) tvGo(1); }
      tvDraw();
    }
  } else {
    if (d.event === "timeupdate" && d.data) { tv.cur = d.data.seconds; tv.dur = d.data.duration; }
    else if (d.event === "play") tv.playing = true;
    else if (d.event === "pause") tv.playing = false;
    else if (d.event === "ended") tvGo(1);
    else if (d.event === "ready") tvListen();
    tvDraw();
  }
});
document.addEventListener("keydown", function (e) {
  if (!tv.on) return;
  var k = e.key;
  if (k === "Escape") { tvClose(); return; }
  if (k === "ArrowDown" || k === "PageDown" || k === "j") { e.preventDefault(); tvGo(1); }
  else if (k === "ArrowUp" || k === "PageUp" || k === "k") { e.preventDefault(); tvGo(-1); }
  else if (k === " ") { e.preventDefault(); tvToggle(); }
  else if (k === "m") tvMute();
  else if (k === "f") tvFull();
  tvPing();
});
tvEl("tv").addEventListener("pointermove", tvPing);
tvEl("tv-exit").addEventListener("click", tvClose);
tvEl("tv-full").addEventListener("click", tvFull);
tvEl("tv-prev").addEventListener("click", function () { tvGo(-1); tvPing(); });
tvEl("tv-next").addEventListener("click", function () { tvGo(1); tvPing(); });
tvEl("tv-play").addEventListener("click", function () { tvToggle(); tvPing(); });
tvEl("tv-mute").addEventListener("click", function () { tvMute(); tvPing(); });
tvEl("tv-fav").addEventListener("click", function () { tvFav(); tvPing(); });
tvEl("tv-info").addEventListener("click", function () { var i = tv.idx; tvClose(); openPanel(i); });
tvEl("tv-mode").addEventListener("click", function () { tv.direct = !tv.direct; tvUnmount(); tv.got = false; tvMount(tv.pos); tvDraw(); tvPing(); });
var sk = tvEl("tv-seek");
sk.addEventListener("pointerdown", function () { tv.seeking = true; });
sk.addEventListener("pointerup", function () { tv.seeking = false; tvPing(); });
sk.addEventListener("input", function () { if (tv.dur) { tv.cur = sk.value / 1000 * tv.dur; tvCmd("seek", tv.cur); tvDraw(); } });
tvEl("tvbtn").addEventListener("click", function () { tvOpen(tv.idx >= 0 && V[tv.idx] && (!filter || matches(V[tv.idx])) ? tv.idx : -1); });
document.getElementById("favs").addEventListener("click", function () {
  if (filter && filter.val === "★fav") filter = null; else filter = { label: "Favoritos", val: "★fav" };
  build(); if (filter) document.getElementById("fbar").scrollIntoView({ behavior: "smooth" });
});
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme").textContent = t === "light" ? "● Negro" : "☼ Blanco";
  try { localStorage.setItem("visionnaire.theme", t); } catch (e) {}
}
var theme = "dark";
try { if (localStorage.getItem("visionnaire.theme") === "light") theme = "light"; } catch (e) {}
document.getElementById("theme").addEventListener("click", function () { theme = theme === "light" ? "dark" : "light"; applyTheme(theme); });
applyTheme(theme);
FAV = loadFav();
V = load();
build();
